url: https://mcanzi.de/silverback/

template:
  bootstrap: 5
  theme: a11y-dark
  bslib:
    bg: "#0c1309"
    fg: "#e6ecd9"
    primary: "#8fb35a"
    secondary: "#9aa58a"
    link-color: "#a9c97a"
    link-hover-color: "#bdd29f"
    code-color: "#d9c96a"
    border-color: "#2c3b20"
    navbar-bg: "#0c1309"
    base_font: "Atkinson Hyperlegible"
    heading_font: "Bricolage Grotesque"
    code_font: "JetBrains Mono"
  includes:
    in_header: <link rel="stylesheet" href="https://mcanzi.de/fonts/fonts.css">

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, website, github]
  components:
    website:
      text: mcanzi.de
      href: https://mcanzi.de/
      aria-label: Massimiliano Canzi's website

reference:
- title: Reading
  contents:
  - read_gorilla
  - gorilla_example
- title: Tidy tables
  contents:
  - gorilla_trials
  - gorilla_wide
  - gorilla_participants
- title: Checking
  contents:
  - summary.gorilla_data
  - gorilla_checks
- title: Sharing and saving
  contents:
  - blind_ids
  - write_gorilla
- title: Package
  contents:
  - silverback-package
