url: https://mcanzi.de/silverback/

template:
  bootstrap: 5
  theme: a11y-dark
  bslib:
    bg: "#121310"
    fg: "#ebe2cd"
    primary: "#a06ae6"
    secondary: "#a69d89"
    link-color: "#aac6cf"
    link-hover-color: "#b688ee"
    code-color: "#d5813f"
    border-color: "#343a2e"
    navbar-bg: "#121310"
    base_font: "Atkinson Hyperlegible"
    heading_font: "Bricolage Grotesque"
    code_font: "JetBrains Mono"
  includes:
    in_header: <link rel="stylesheet" href="https://mcanzi.de/fonts/fonts.css">

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, website, github]
  components:
    website:
      text: mcanzi.de
      href: https://mcanzi.de/
      aria-label: Massimiliano Canzi's website

reference:
- title: Reading
  contents:
  - read_gorilla
  - gorilla_example
- title: Eye and mouse tracking
  contents:
  - read_eyetracking
  - read_mousetracking
- title: Tidy tables
  contents:
  - gorilla_trials
  - gorilla_wide
  - gorilla_participants
- title: Checking
  contents:
  - summary.gorilla_data
  - gorilla_checks
- title: Sharing and saving
  contents:
  - blind_ids
  - write_gorilla
- title: Package
  contents:
  - silverback-package
